<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorteio Top 250</title>
<style>
:root{
  --bg:#14181c; --bg2:#1c2228; --card:#20272e; --line:#2c333a;
  --txt:#eff2f4; --txt2:#9ab; --green:#00e054; --orange:#ff8000; --blue:#40bcf4;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#14181c; } }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100vh; display:flex; justify-content:center;
}
.wrap{max-width:640px;width:100%;padding:28px 20px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:8px}
h1{font-size:22px;font-weight:800;letter-spacing:.2px}
h1 span{color:var(--green)}
.count{font-size:13px;color:var(--txt2)}
.btn{
  display:block;width:100%;padding:16px;border:none;border-radius:6px;
  background:var(--green);color:#0a1a10;font-size:16px;font-weight:800;
  cursor:pointer;letter-spacing:.3px;
}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--txt2);font-weight:600;font-size:13px;padding:10px}
.results{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
@media (max-width:440px){.results{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.poster{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:rgba(255,255,255,.85);text-align:center;padding:10px}
.meta{padding:12px}
.title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:4px}
.sub{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.year{font-size:12px;color:var(--txt2)}
.rating{font-size:12px;font-weight:800;color:var(--green)}
.markbtn{width:100%;padding:9px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);border-radius:5px;font-size:12px;font-weight:700;cursor:pointer}
.markbtn.done{background:var(--green);color:#0a1a10;border-color:var(--green)}
.empty{color:var(--txt2);font-size:14px;text-align:center;padding:40px 10px}
.footer{margin-top:26px;border-top:1px solid var(--line);padding-top:16px;display:flex;gap:10px}
.watchedlist{margin-top:16px;font-size:13px;color:var(--txt2);max-height:180px;overflow-y:auto;display:none}
.watchedlist.open{display:block}
.watchedlist div{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.watchedlist button{background:none;border:none;color:var(--orange);font-size:12px;cursor:pointer}
.setup{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px}
.setup p{font-size:13px;color:var(--txt2);margin-bottom:10px;line-height:1.5}
.setup input{width:100%;padding:10px;border-radius:5px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-size:13px;margin-bottom:8px}
.setup a{color:var(--blue)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster{position:relative}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>sorteio<span>250</span></h1>
    <div class="count" id="count"></div>
  </header>

  <div class="setup" id="setup" style="display:none">
    <p>Pra mostrar os posteres reais, cole sua API key (v3) da TMDB. Ela fica salva só neste navegador, nunca sai daqui. Crie a sua de graça em <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org/settings/api</a>.</p>
    <input type="text" id="apiKeyInput" placeholder="cole sua API key da TMDB aqui">
    <button class="btn" id="saveKeyBtn" style="padding:10px">salvar</button>
  </div>

  <button class="btn" id="drawBtn">sortear 2 filmes</button>

  <div class="results" id="results"></div>

  <div class="footer">
    <button class="btn secondary" id="toggleWatched">ver assistidos</button>

const STORAGE_KEY = "sorteio250_watched";
let watched = [];
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  watched = raw ? JSON.parse(raw) : [];
} catch(e) { watched = []; }

let currentPair = [];

const KEY_STORAGE = "sorteio250_tmdbkey";
const CACHE_STORAGE = "sorteio250_postercache";
let posterCache = {};
try {
  const rawc = localStorage.getItem(CACHE_STORAGE);
  posterCache = rawc ? JSON.parse(rawc) : {};
} catch(e){ posterCache = {}; }

function getApiKey(){
  try { return localStorage.getItem(KEY_STORAGE) || ""; } catch(e){ return ""; }
}
function saveCache(){
  try { localStorage.setItem(CACHE_STORAGE, JSON.stringify(posterCache)); } catch(e){}
}

async function fetchPoster(title, year){
  const cacheKey = title + "|" + year;
  if (posterCache[cacheKey] !== undefined) return posterCache[cacheKey];
  const key = getApiKey();
  if (!key) return null;
  try {
    const url = `https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(key)}&query=${encodeURIComponent(title)}&year=${year}`;
    const res = await fetch(url);
    if (!res.ok) { posterCache[cacheKey] = null; saveCache(); return null; }
    const data = await res.json();
    const first = data.results && data.results[0];
    const path = first && first.poster_path ? `https://image.tmdb.org/t/p/w342${first.poster_path}` : null;
    posterCache[cacheKey] = path;
    saveCache();
    return path;
  } catch(e){
    return null;
  }
}

function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(watched)); } catch(e){}
}

function isWatched(t){ return watched.includes(t); }

function posterGradient(title){
  let h = 0;
  for (let i=0;i<title.length;i++) h = (h*31 + title.charCodeAt(i)) % 360;
  return `linear-gradient(160deg, hsl(${h},45%,26%), hsl(${(h+40)%360},50%,14%))`;
}

function initials(title){
  return title.split(" ").filter(w=>w.length>2 || /^[A-Z]/.test(w)).slice(0,2).map(w=>w[0]).join("").toUpperCase() || title[0];
}

function updateCount(){
  document.getElementById("count").textContent = watched.length + " de " + MOVIES.length + " assistidos";
}

function renderResults(){
  const el = document.getElementById("results");
  if (currentPair.length === 0){ el.innerHTML = ""; return; }
  el.innerHTML = currentPair.map((m,i) => {
    const [title,year,rating] = m;
    const done = isWatched(title);
    return `<div class="card">
      <div class="poster" id="poster-${i}" style="background:${posterGradient(title)}">${initials(title)}</div>
      <div class="meta">
        <div class="title">${title}</div>
        <div class="sub"><span class="year">${year}</span><span class="rating">★ ${rating}</span></div>
        <button class="markbtn ${done?'done':''}" data-title="${title.replace(/"/g,'&quot;')}">${done ? 'assistido ✓' : 'marcar como assistido'}</button>
      </div>
    </div>`;
  }).join("");
  el.querySelectorAll(".markbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = btn.getAttribute("data-title");
      if (!isWatched(t)) { watched.push(t); save(); updateCount(); renderResults(); renderWatchedList(); }
    });
  });
  currentPair.forEach((m,i) => {
    const [title,year] = m;
    fetchPoster(title, year).then(url => {
      if (!url) return;
      const posterEl = document.getElementById(`poster-${i}`);
      if (posterEl) posterEl.innerHTML = `<img src="${url}" alt="${title}" loading="lazy">`;
    });
  });
}

function draw(){
  const remaining = MOVIES.filter(m => !isWatched(m[0]));
  const el = document.getElementById("results");
  if (remaining.length === 0){
    currentPair = [];
    el.innerHTML = `<div class="empty" style="grid-column:1/-1">Você já assistiu a lista inteira! Zere a lista para sortear de novo.</div>`;
    return;
  }
  if (remaining.length === 1){
    currentPair = [remaining[0]];
  } else {
    const idx1 = Math.floor(Math.random()*remaining.length);
    let idx2 = Math.floor(Math.random()*remaining.length);
    while (idx2 === idx1) idx2 = Math.floor(Math.random()*remaining.length);
    currentPair = [remaining[idx1], remaining[idx2]];
  }
  renderResults();
}

function renderWatchedList(){
  const el = document.getElementById("watchedList");
  if (watched.length === 0){
    el.innerHTML = `<div class="empty">Nenhum filme marcado ainda.</div>`;
    return;
  }
  el.innerHTML = watched.slice().reverse().map(t => `<div>${t}<button data-title="${t.replace(/"/g,'&quot;')}">remover</button></div>`).join("");
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = btn.getAttribute("data-title");
      watched = watched.filter(w => w !== t);
      save(); updateCount(); renderWatchedList(); renderResults();
    });
  });
}

document.getElementById("drawBtn").addEventListener("click", draw);
document.getElementById("toggleWatched").addEventListener("click", () => {
  const el = document.getElementById("watchedList");
  el.classList.toggle("open");
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Tem certeza que quer apagar toda a lista de assistidos?")){
    watched = []; save(); updateCount(); renderWatchedList(); renderResults();
  }
});

document.getElementById("saveKeyBtn").addEventListener("click", () => {
  const val = document.getElementById("apiKeyInput").value.trim();
  if (!val) return;
  try { localStorage.setItem(KEY_STORAGE, val); } catch(e){}
  document.getElementById("setup").style.display = "none";
  renderResults();
});

if (!getApiKey()){
  document.getElementById("setup").style.display = "block";
}

updateCount();
renderWatchedList();
</script>
